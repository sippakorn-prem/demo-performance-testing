version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: demo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: demo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring
    restart: unless-stopped
    labels:
      # Custom labels for easy identification in Prometheus/Grafana
      - "app=demo-postgres"
      - "service=demo-postgres"
      - "component=db"
      - "workshop=performance-testing"
    # TEACHING PURPOSE: Postgres provides persistent storage for products and cart data

  api:
    build: .
    ports:
      - "8000:8000"
    container_name: demo-api
    # TEACHING PURPOSE: Keep container running for easy restart during workshop
    restart: unless-stopped
    networks:
      - monitoring
    volumes:
      # Mount app directory for hot-reload during development
      # Changes to app/main.py will automatically reload without container restart
      - ./app:/app/app
      # Mount alembic for migration development
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/demo_db
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - postgres
    labels:
      # Custom labels for easy identification in Prometheus/Grafana
      - "app=demo-api"
      - "service=demo-api"
      - "component=api"
      - "workshop=performance-testing"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - monitoring
    restart: unless-stopped
    # TEACHING PURPOSE: Prometheus scrapes metrics from the API for visualization

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      # TEACHING PURPOSE: Export Postgres internal metrics (connections, cache hit ratio, deadlocks, etc.)
      # Uses same credentials as the demo database
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/demo_db?sslmode=disable"
    ports:
      # Expose exporter metrics for local debugging if needed
      - "9187:9187"
    networks:
      - monitoring
    depends_on:
      - postgres
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - "--docker_only=true"
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=app,service,component,workshop"
    networks:
      - monitoring
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    # TEACHING PURPOSE: cAdvisor exposes container CPU, memory, and network metrics

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3500:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - prometheus
      - cadvisor
    # TEACHING PURPOSE: Grafana visualizes Prometheus metrics for easy observation during workshop

networks:
  monitoring:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
